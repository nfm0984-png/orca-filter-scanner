name: Scan
run-name: "${{ github.event_name == 'schedule' && 'scheduled scan' || 'manual scan' }}"
# Every 15 minutes; scheduled runs no-op from midnight to 6 AM America/Los_Angeles (DST-safe). Manual runs always work.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "app.js", "manifest.webmanifest"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      KALSHI_SCANNER_PASSCODE: ${{ secrets.KALSHI_SCANNER_PASSCODE }}
    steps:
      - name: Quiet hours (midnight-6 AM PT)
        id: quiet
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/Los_Angeles"))
          skip = os.environ.get("GITHUB_EVENT_NAME") == "schedule" and 0 <= now.hour < 6
          print("PT now", now.strftime("%a %b %-d %-I:%M %p %Z"), "quiet" if skip else "run")
          open(os.environ["GITHUB_OUTPUT"], "a").write("skip=%s\n" % ("1" if skip else "0"))
          PY
      - uses: actions/checkout@v4
        if: steps.quiet.outputs.skip != '1'
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: steps.quiet.outputs.skip != '1'
        with:
          python-version: "3.12"
      - name: Restore scanner cache (leaderboards, settled bets, start times)
        if: steps.quiet.outputs.skip != '1' && github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: |
            state/settled.json
            state/boards.json
            state/starts.json
          key: orca-filter-state-${{ github.run_id }}
          restore-keys: orca-filter-state-
      - name: Unwrap ledger
        if: steps.quiet.outputs.skip != '1'
        run: |
          pip install -q cryptography
          python3 scanner/gate_crypto.py decrypt
      - name: Scan
        if: steps.quiet.outputs.skip != '1' && github.event_name != 'push'
        working-directory: scanner
        env:
          ORCA_API_KEY: ${{ secrets.ORCA_API_KEY }}
        run: |
          B=240; [ -f ../state/settled.json ] || B=900
          python3 -u scan.py --settled-budget "$B"
      - name: Encrypt and commit
        if: steps.quiet.outputs.skip != '1'
        run: |
          python3 scanner/gate_crypto.py encrypt
          if [ "${{ github.event_name }}" != "push" ]; then
            git config user.name "orca-filter-bot"; git config user.email "actions@users.noreply.github.com"
            git add data.json state/picks.json gate.json
            if ! git diff --cached --quiet; then
              git commit -q -m "scan $(TZ=America/Los_Angeles date '+%a %b %-d %-I:%M %p PT')"
              for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
            fi
          fi
          mkdir -p _site && cp index.html app.js data.json gate.json manifest.webmanifest robots.txt .nojekyll _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        if: steps.quiet.outputs.skip != '1'
        with:
          path: _site
      - id: deploy
        if: steps.quiet.outputs.skip != '1'
        uses: actions/deploy-pages@v4
